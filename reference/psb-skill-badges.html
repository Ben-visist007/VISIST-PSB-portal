<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSB Skill Badges</title>
<style>:root{box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: the existing Visist portal shell (top bar, left nav, light work surface) with a slide-in event simulator on the right. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafbfc; --sunk:#ebecf0; --line:#dfe1e6;
  --fg:#172b4d; --muted:#5e6c84; --subtle:#8993a4;
  --brand:#026b33; --brand-2:#247e45; --brand-soft:#e3f1e8; --on-brand:#ffffff;
  --warn:#a35200; --warn-soft:#fff3e0; --danger:#c9372c; --danger-soft:#ffeceb; --info:#0c66e4; --info-soft:#e9f2ff;
  --t-spark:#b4632b; --t-scout:#6f8196; --t-star:#b98a12; --t-champ:#3d4f8f;
  --t-spark-soft:#f8ece3; --t-scout-soft:#eceff3; --t-star-soft:#f8f0da; --t-champ-soft:#e6e9f5; --t-ace:#026b33; --t-ace-soft:#e3f1e8;
  --shadow:0 1px 2px rgba(9,30,66,.08),0 4px 16px rgba(9,30,66,.08);
  --font-head:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0d11; --surface:#15151b; --surface-2:#1b1c23; --sunk:#22242c; --line:#2d303b;
  --fg:#e7e9ef; --muted:#a4abba; --subtle:#7d8596;
  --brand:#3fb06a; --brand-2:#57c27f; --brand-soft:#123220; --on-brand:#06140b;
  --warn:#f0a050; --warn-soft:#33240f; --danger:#f07a70; --danger-soft:#3a1a18; --info:#7fb2ff; --info-soft:#14243f;
  --t-spark:#d98a52; --t-scout:#a2b1c3; --t-star:#e0b445; --t-champ:#8796d8;
  --t-spark-soft:#33231a; --t-scout-soft:#252a32; --t-star-soft:#332a12; --t-champ-soft:#1e2340; --t-ace:#3fb06a; --t-ace-soft:#123220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d0d11; --surface:#15151b; --surface-2:#1b1c23; --sunk:#22242c; --line:#2d303b;
  --fg:#e7e9ef; --muted:#a4abba; --subtle:#7d8596;
  --brand:#3fb06a; --brand-2:#57c27f; --brand-soft:#123220; --on-brand:#06140b;
  --warn:#f0a050; --warn-soft:#33240f; --danger:#f07a70; --danger-soft:#3a1a18; --info:#7fb2ff; --info-soft:#14243f;
  --t-spark:#d98a52; --t-scout:#a2b1c3; --t-star:#e0b445; --t-champ:#8796d8;
  --t-spark-soft:#33231a; --t-scout-soft:#252a32; --t-star-soft:#332a12; --t-champ-soft:#1e2340; --t-ace:#3fb06a; --t-ace-soft:#123220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800} h2{font-size:17px;font-weight:700} h3{font-size:14px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:15px;flex:none}
.brand b{font-family:var(--font-head);font-size:15px;display:block;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap}
.top .spacer{flex:1}
.clock{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 10px;white-space:nowrap}
.role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.role select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;color:var(--fg);max-width:240px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dark{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.dark[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .eyebrow{padding:8px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:0;background:none;text-align:left;font-weight:600;color:var(--muted);width:100%}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.nav svg{flex:none}
.nav .pill{margin-left:auto}
.side .foot{margin-top:auto;font-size:12px;color:var(--subtle);padding:10px;border-top:1px solid var(--line)}
main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .grow{flex:1;min-width:220px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2,.card > .ch{margin-bottom:12px}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch .grow{flex:1}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpi .v{font-family:var(--font-head);font-size:28px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.info{background:var(--info-soft);color:var(--info)}
.lvl{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 3px;font-size:12px;font-weight:700;white-space:nowrap}
.lvl i{width:16px;height:16px;border-radius:50%;display:inline-block}
.lvl.none{background:var(--sunk);color:var(--muted);padding-left:10px}
.lvl.spark{background:var(--t-spark-soft);color:var(--t-spark)} .lvl.spark i{background:var(--t-spark)}
.lvl.scout{background:var(--t-scout-soft);color:var(--t-scout)} .lvl.scout i{background:var(--t-scout)}
.lvl.star{background:var(--t-star-soft);color:var(--t-star)} .lvl.star i{background:var(--t-star)}
.lvl.champ{background:var(--t-champ-soft);color:var(--t-champ)} .lvl.champ i{background:var(--t-champ)}
.lvl.ace{background:var(--t-ace-soft);color:var(--t-ace)} .lvl.ace i{background:var(--t-ace)}


/* metal badges */
.bdg{overflow:visible;transition:transform .2s ease;display:block}
.bdg.on{filter:drop-shadow(0 2px 2px rgba(9,30,66,.28))}
.bd:hover .bdg.on,.pc-badges .bdg.on:hover{transform:translateY(-2px) rotate(-4deg) scale(1.06)}
.em{overflow:visible;display:block}

/* account switcher */
.acct{position:relative}
.acct-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;text-align:left;max-width:260px}
.acct-btn:hover{background:var(--surface-2)}
.acct-btn .av{width:30px;height:30px}
.acct-btn .t{min-width:0}
.acct-btn b{display:block;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-btn small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.acct-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:290px;max-width:calc(100vw - 32px);padding:6px;animation:rise .15s}
.acct-menu .eyebrow{padding:10px 8px 4px}
.acct-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.acct-menu button:hover{background:var(--surface-2)}
.acct-menu button.on{background:var(--brand-soft)}
.acct-menu button .grow{flex:1;min-width:0}
.acct-menu button b{display:block;font-size:13px}
.acct-menu button small{display:block;color:var(--muted);font-size:11px}
.acct-menu .ck{color:var(--brand)}
.av.k-admin{background:var(--brand);color:var(--on-brand)}
.av.k-head{background:var(--t-star-soft);color:var(--t-star)}
.av.k-assistant{background:var(--info-soft);color:var(--info)}

/* players */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stg{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.stg:hover{border-color:var(--c,var(--fg))}
.stg.on{border-color:var(--c,var(--fg));box-shadow:inset 0 0 0 1px var(--c,var(--fg));background:var(--cs,var(--surface-2))}
.stg .em,.stg .ic{width:32px;height:36px;flex:none}
.stg .ic{border-radius:50%;display:grid;place-items:center;height:32px;background:var(--cs);color:var(--c)}
.stg .t{min-width:0}
.stg b{font-family:var(--font-head);font-size:20px;display:block;line-height:1}
.stg small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1}
.sbox{position:relative;flex:1 1 220px;max-width:340px}
.sbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--subtle)}
.sbox input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px 8px 33px}
.sel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sel select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;font-size:13px;color:var(--fg);max-width:170px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 10px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fg);color:var(--surface)}
.grp-h{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.grp-h h2{font-size:15px}
.grp-h .ln{flex:1;height:1px;background:var(--line)}
.grp-h .pill{background:var(--surface);border:1px solid var(--line)}
.grp-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}

/* player rows (clean list) */
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plist-h,.prow{display:grid;grid-template-columns:minmax(190px,2fr) minmax(130px,1.1fr) minmax(250px,2.2fr) minmax(120px,1fr) 84px;gap:14px;align-items:center;padding:10px 16px}
.plist-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);padding-block:8px}
.prow{border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface-2)}
.prow .who b{font-size:14px}
.cell-sub{font-size:12px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-main{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prog-line{display:flex;align-items:center;gap:8px}
.prog-line .bar{flex:1;min-width:48px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;gap:2px}
.prog-line .bar i{flex:1;background:var(--sunk);display:block}
.prog-line .bar i.on{background:var(--c)}
.prog-line b{font-size:13px;min-width:38px;text-align:right}
.flags{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.flag{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.flag.danger{background:var(--danger-soft);color:var(--danger)}
.flag.info{background:var(--info-soft);color:var(--info)}
.flag.mute{background:var(--sunk);color:var(--muted)}
.prow select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:12px;max-width:100%}
.pav{width:40px;height:40px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0);flex:none}
.pav span{width:100%;height:100%;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:12px}

/* player cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.pc::before{content:"";position:absolute;inset:0 0 auto;height:64px;background:linear-gradient(180deg,var(--cs),transparent);pointer-events:none}
.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--c)}
.pc>*{position:relative}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-top .grow{flex:1;min-width:0}
.pc-top b{display:block;font-family:var(--font-head);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-top small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-top .em{width:38px;height:42px;flex:none}
.pc-stage{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-stage .s{font-family:var(--font-head);font-weight:800;color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pc-stage .num{font-family:var(--font-head);font-weight:800;font-size:18px}
.pc-stage i{font-style:normal;color:var(--subtle);font-size:12px}
.pc-badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.pc-badges>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}
.pc-badges svg{width:100%;height:auto}
.pc-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pc-foot b{color:var(--fg)}
.pc-foot .grow{flex:1}

/* team */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tc{display:flex;flex-direction:column;gap:12px}
.tc .top{display:flex;gap:12px;align-items:center}
.tc .top .av{width:44px;height:44px;font-size:15px}
.tc .top .grow{flex:1;min-width:0}
.tc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc .stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px}
.tc .stats b{font-family:var(--font-head);font-size:18px;display:block}
.tc .stats small{font-size:11px;color:var(--muted)}
.vchips{display:flex;gap:5px;flex-wrap:wrap}
.form{display:flex;flex-direction:column;gap:12px}
.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%}

/* curriculum */
.path{display:flex;align-items:center;justify-content:space-between;gap:6px;overflow-x:auto;padding:4px 2px}
.pstep{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;text-align:center}
.pstep .em{width:46px;height:51px}
.pstep b{font-family:var(--font-head);font-size:14px}
.pstep small{font-size:11px;color:var(--muted)}
.path .arr{color:var(--subtle);transform:rotate(-90deg);flex:none}
.ccol{align-self:start;display:flex;flex-direction:column;gap:12px}
.ccol .ch{margin-bottom:0}
.cbadges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cbadges>div{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.cbadges svg{width:52px;height:52px}
.cbadges span{font-size:12px;font-weight:600;line-height:1.2}
.more{align-self:flex-start;border:0;background:none;padding:2px 0;color:var(--brand);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.cmore{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px dashed var(--line);margin-top:12px;animation:rise .2s}
.ccol .cmore{margin-top:0}
.cmore p{margin:0;font-size:13px;color:var(--muted)}
.cmore p b{color:var(--fg)}
.cskill b{display:block;font-size:13px}
.cskill small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rules{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.rules>div{display:flex;align-items:center;gap:9px;font-size:13px}
.rules>div svg{color:var(--brand);flex:none}

.ctab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
.cth{padding:4px 6px 6px;text-align:center;min-width:0}
.cth b{font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--c);display:block;letter-spacing:-.01em}
.cth small{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.ctd{border:0;background:none;border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0;transition:background .15s,transform .15s}
.ctd:hover{background:var(--surface-2);transform:translateY(-2px)}
.ctd.on{background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.ctd svg{width:84px;height:84px}
.ctd span{font-size:14px;font-weight:700;line-height:1.25}

/* skill mapping */

.pboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px}

/* settings */

/* table */
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;min-width:760px}

td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--sunk);color:var(--fg);flex:none;font-family:var(--font-head)}

/* bars */
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--sunk)}

.hbars{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 44px;gap:7px 10px;align-items:center;font-size:13px}

.cols{display:flex;align-items:flex-end;gap:18px;height:150px;padding-top:10px}

/* badges */
.board{display:flex;flex-direction:column;gap:12px}

.shine{position:relative;overflow:hidden}

.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.prog{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px}

.vids{display:flex;flex-direction:column;gap:10px}
.vid .lab{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.meter{position:relative;height:10px;background:var(--sunk);border-radius:5px;margin-top:5px}
.meter div{height:100%;border-radius:5px}
.meter .th{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.6}

/* modal + drawer */
.modal{position:fixed;inset:0;z-index:50;background:rgba(9,30,66,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:calc(28px + env(safe-area-inset-top,0px)) 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:960px;animation:rise .25s ease-out;min-width:0}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.dh{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dh .grow{flex:1;min-width:180px}
.db{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}

.sim{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.sim .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sim .sh .grow{flex:1}
.sim .tabs{padding:0 10px}
.sim .sb{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.field{display:flex;flex-direction:column;gap:5px}

.field input[type=text],.field input[type=number],.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center;font-size:13px}
.slider input{width:100%;accent-color:var(--brand)}
.slider b{text-align:right}
.slider .f{color:var(--danger)} .slider .p{color:var(--brand)}
.seq{counter-reset:s;display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.seq li{counter-increment:s;display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 8px;border-radius:6px;background:var(--surface-2)}
.seq li::before{content:counter(s);width:20px;height:20px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;cursor:pointer}
.radio label.on{border-color:var(--brand);background:var(--brand-soft)}
.radio input{accent-color:var(--brand);margin-top:3px}
.log .li{font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--subtle)}

.days{display:flex;flex-direction:column;gap:6px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}

.day .date{width:44px;text-align:center;flex:none}
.day .date b{font-family:var(--font-head);font-size:18px;display:block;line-height:1}
.day .date small{font-size:11px;color:var(--muted);text-transform:uppercase}
.day .grow{flex:1;min-width:0}
.pick{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}

.pick input{accent-color:var(--brand);width:16px;height:16px}
.pick .grow{flex:1;min-width:0}
.pick small{display:block;color:var(--muted);font-size:12px}

/* day plan */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gcard{}
.focus{display:flex;flex-direction:column;gap:8px}
.fs{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}

.res{display:flex;flex-direction:column;gap:10px}

.rsk .new{color:var(--brand);font-weight:700}

/* phone preview */
.phone{width:300px;max-width:100%;margin:0 auto;border:10px solid var(--fg);border-radius:34px;background:var(--surface);overflow:hidden}
.phone .scr{padding:18px 14px;display:flex;flex-direction:column;gap:12px;min-height:520px}
.phone .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phone .mini svg{width:100%;height:auto}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--fg);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);animation:rise .2s}

@media (max-width:900px){.stages{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.plist-h{display:none}.prow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.prow .c-coach,.prow .c-next{display:none}.prow .c-prog{grid-column:1/-1;order:3}}

  .shell{grid-template-columns:minmax(0,1fr)}

  .side .eyebrow,.side .foot{display:none}

}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<header class="top">
  <div class="brand"><div class="logo">V</div><div><b>PSB Academy</b><span>Powered by Visist</span></div></div>

  <button class="btn dark" id="simBtn" data-act="openSim" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>Event simulator</button>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>

</div>
<aside class="sim" id="sim" hidden aria-label="Event simulator"></aside>

<div id="toast" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ---------------- Curriculum config (names from the PSB "Reward based assessment system" sheet) ----------------
   A column is the stage a kid is in. Its 4 skill badges carry the name of the badge they unlock:
   4 "Scout" skills in the Spark column = Scout badge, 4 "Star" skills = Star, 4 "Champ" skills = Champ, finishing the Champ column completes all 16 (no extra badge). */
const STAGES=[
  {id:'spark',name:'Spark',sub:''},
  {id:'scout',name:'Scout',sub:''},
  {id:'star',name:'Star',sub:''},
  {id:'champ',name:'Champ',sub:''},
  {id:'champ',name:'All 16',sub:'',final:true}];
const LEVELS=[
  {id:'spark',name:'Spark',week:1,award:'Scout',who:'Just picked up the racket: grip, footwork basics, and how not to hit anyone on the serve.',focus:['Fun oriented','Less duration','High engagement']},
  {id:'scout',name:'Scout',week:2,award:'Star',who:'Solid fundamentals, improving consistently, starting to understand technique and court dimensions.',focus:['Fun oriented','Higher frequency','Moderate attention','Corrections start']},
  {id:'star',name:'Star',week:3,award:'Champ',who:'Strong technique, competitive in learning, has a go-to shot or two that threatens most younger players.',focus:['Goal oriented','Higher training volume','Attention to detail','Corrections priority']},
  {id:'champ',name:'Champ',week:4,award:'All 16',who:'Rally hungry, counting points, knows the rules and competes with a personalised stroke.',focus:['½-court game oriented','Higher intensity & volume','Corrections priority with an element of speed']}].map((l,i)=>({...l,idx:i}));
const SKILLS=[
  ['grip','spark','Grip Scout','Gr','Perfect grip demonstrations',[['fh','Forehand grip'],['bh','Backhand grip']]],
  ['airtoss','spark','Airtoss Scout','AT','Min 10 FH & 10 BH air tosses with right grip',[['fh','10 forehand air tosses'],['bh','10 backhand air tosses']]],
  ['keeplift','spark','Keep & Lift Scout','KL','Perfect one-step underarm stroke with fair accuracy & leg alignment',[['keep','Net keep'],['lift','Underarm lift']]],
  ['lowserve','spark','Low Serve Scout','LS','No-fault accurate BH low serves',[['bh','Backhand low serves'],['acc','Accuracy to target']]],
  ['gripchange','scout','Grip Change Star','GC','Min 10 alternate air tosses with quick grip change',[['alt','10 alternate air tosses'],['speed','Quick grip change']]],
  ['forecourt','scout','Fore-Court Star','FC','Half-court movement, keeps & lift with fair accuracy, technique & leg alignment',[['move','Half-court movement'],['keep','Keeps'],['lift','Lifts']]],
  ['hawkeye','scout','Hawk Eye Star','HE','Ball catch from an underarm throw, catch back with the opposite hand without a bounce, 10 times',[['throw','Underarm throw & catch'],['opp','Opposite-hand catch ×10']]],
  ['highserve','scout','High Serve Star','HS','No-fault, clean FH high serves',[['fh','Forehand high serves'],['clean','No-fault check']]],
  ['drive','star','Drive Champ','Dr','Lateral movement + FH & BH drives with fair technique, flat returns & alignment',[['fh','Forehand drives'],['bh','Backhand drives']]],
  ['overhead','star','Overhead Champ','OH','Standing hand-fed clear, drop & smash with body-weight transfer and arm extension',[['clear','Clear'],['drop','Drop'],['smash','Smash']]],
  ['shadow','star','Shadow Champ','Sh','Double-leg hops, split jumps, high knees & shuffle over the agility ladder',[['hops','Hops & split jumps'],['ladder','High knees & shuffle (ladder)']]],
  ['fhfront','star','Forehand Front Serve Champ','FS','FH low serves, 3 variations along the service line',[['v1','Variation 1'],['v2','Variation 2'],['v3','Variation 3']]],
  ['netking','champ','Netking Champ','NK','12 strokes, one-step single-shuttle rally with coach',[['rally','12-stroke net rally']]],
  ['rearcourt','champ','Rear-Court Champ','RC','½-court positioning under the shuttle; clear, drop & smash with fore-court follow-up',[['clear','Clear + follow-up'],['drop','Drop + follow-up'],['smash','Smash + follow-up']]],
  ['consistency','champ','Consistency Champ','Co','20 basic strokes, single shuttle in half court with a coach',[['rally','20-stroke half-court rally']]],
  ['bhflick','champ','Backhand Flick Serve Champ','BF','BH high serves, 3 variations along the back lobby',[['v1','Variation 1'],['v2','Variation 2'],['v3','Variation 3']]],
].map(([id,tier,name,abbr,std,v],i)=>({id,tier,name,abbr,std,order:i,videos:v.map(([k,label])=>({id:id+'.'+k,label}))}));

/* ---------------- skill library (100+ skills) → skill sets (16) → badges (4 columns) ---------------- */
const LIB_RAW={
  'Grip':['Forehand grip','Backhand grip','Panhandle grip','Bevel grip','Thumb grip','Grip change FH→BH','Grip change BH→FH','Finger power squeeze'],
  'Footwork':['Ready stance','Split step','Chasse step','Cross-over step','Front lunge','Lunge recovery','Scissor jump','Round-the-head footwork','Side shuffle','Two-step to net','Three-step to rear','Return to base','Pivot turn','Heel-first landing','Knee alignment on lunge','Centre-court recovery'],
  'Serve':['BH low serve','FH low serve','FH high serve','BH flick serve','FH flick serve','Drive serve','Serve stance','Service-line accuracy','No-fault serve legality','Serve variation (3 targets)','Shuttle drop & release','Serve follow-through'],
  'Net play':['Net keep','Underarm lift','Net kill','Net tumble','Net push','Net brush','Racket up at net','Spinning net shot','Cross-court net shot','Net interception','One-step net reach','Net rally consistency'],
  'Overhead':['FH clear','BH clear','Round-the-head clear','FH drop','Slice drop','Reverse slice','FH smash','Jump smash','Stick smash','Body-weight transfer','Arm extension at contact','Contact above head','Overhead follow-through','Sideways turn'],
  'Mid-court':['FH drive','BH drive','Flat return','Push to mid-court','Block return','Lateral movement for drives','Drive rally','Wrist snap on drive','Short-swing preparation','Body-smash return'],
  'Defence':['FH smash defence','BH smash defence','Lift from defence','Block to net','Low ready position','Counter-drive','Clear from defence','Recovery after defence'],
  'Hand–eye':['Air toss FH','Air toss BH','Alternate air toss','Underarm throw & catch','Opposite-hand catch','Shuttle tap-up count','Racket balance','Reaction catch','Tracking focus','Wall rally'],
  'Fitness':['Double-leg hops','Split jumps','High knees (ladder)','Ladder shuffle','Shadow 6-corner','Skipping','Core plank','Shuttle run','Lateral bounds','Reaction sprint','Single-leg balance','Flexibility routine'],
  'Game sense':['Rules knowledge','Score counting','Court lines awareness','Half-court positioning','Rally building','Shot selection','Base position','Doubles rotation basics','Sportsmanship','Point strategy'],
  'Consistency':['12-stroke net rally','20-stroke half-court rally','Clear–clear rally','Drop–lift rally','Drive rally ×20','Serve–return rally']};
const LIB=[];Object.entries(LIB_RAW).forEach(([cat,names])=>names.forEach(name=>LIB.push({id:'k'+LIB.length,name,cat})));
const LIBN=Object.fromEntries(LIB.map(k=>[k.name,k.id])),LK=Object.fromEntries(LIB.map(k=>[k.id,k]));
const CATS=Object.keys(LIB_RAW);
const MAP={};
Object.entries({
  grip:['Forehand grip','Backhand grip','Panhandle grip','Thumb grip'],
  airtoss:['Air toss FH','Air toss BH','Forehand grip','Backhand grip','Shuttle tap-up count'],
  keeplift:['Net keep','Underarm lift','One-step net reach','Knee alignment on lunge','Ready stance'],
  lowserve:['BH low serve','Serve stance','Shuttle drop & release','No-fault serve legality','Service-line accuracy'],
  gripchange:['Alternate air toss','Grip change FH→BH','Grip change BH→FH','Finger power squeeze'],
  forecourt:['Two-step to net','Front lunge','Lunge recovery','Net keep','Underarm lift','Centre-court recovery'],
  hawkeye:['Underarm throw & catch','Opposite-hand catch','Tracking focus','Reaction catch'],
  highserve:['FH high serve','Serve stance','Serve follow-through','No-fault serve legality'],
  drive:['FH drive','BH drive','Flat return','Lateral movement for drives','Short-swing preparation'],
  overhead:['FH clear','FH drop','FH smash','Body-weight transfer','Arm extension at contact','Contact above head'],
  shadow:['Double-leg hops','Split jumps','High knees (ladder)','Ladder shuffle'],
  fhfront:['FH low serve','Serve variation (3 targets)','Service-line accuracy','Shuttle drop & release'],
  netking:['12-stroke net rally','Net push','Racket up at net','One-step net reach'],
  rearcourt:['Half-court positioning','Three-step to rear','FH clear','FH drop','FH smash','Return to base'],
  consistency:['20-stroke half-court rally','Rally building','Base position'],
  bhflick:['BH flick serve','Serve variation (3 targets)','Serve stance','No-fault serve legality']
}).forEach(([set,names])=>{MAP[set]=names.map(n=>{if(!LIBN[n])console.error('missing skill',n);return LIBN[n]})});
const setsUsing=kid=>SKILLS.filter(s=>(MAP[s.id]||[]).includes(kid));
const stageOf=lvl=>STAGES[lvl+1];
const awardTxt=L=>L.idx===3?'all 16 skills':`the ${L.award} badge`;
const SK=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
const LV=Object.fromEntries(LEVELS.map((l,i)=>[l.id,{...l,idx:i}]));
const skillsOf=t=>SKILLS.filter(s=>s.tier===t);
const videosOf=t=>skillsOf(t).flatMap(s=>s.videos);

/* ---------------- dates ---------------- */
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=dt=>dt.toISOString().slice(0,10);
const addDays=(s,n)=>{const t=D(s);t.setUTCDate(t.getUTCDate()+n);return iso(t)};
const fmt=(s,o={weekday:'short',day:'numeric',month:'short'})=>D(s).toLocaleDateString('en-GB',{...o,timeZone:'UTC'});
/* planner settings: which week + weekday each level is assessed, what happens on a 5th week, notice period, who adds students */
const PLAN={days:{spark:{week:1,dow:5},scout:{week:2,dow:5},star:{week:3,dow:5},champ:{week:4,dow:5}},fifth:'makeup',notice:15,mode:'recommend'};
const DOWS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ORD=['1st','2nd','3rd','4th'];
const dayLabel=id=>{const x=PLAN.days[id];return `${ORD[x.week-1]} ${DOWS[x.dow]}`};
const levelForDate=s=>{const t=D(s),w=Math.ceil(t.getUTCDate()/7),dw=t.getUTCDay();const L=LEVELS.find(L=>PLAN.days[L.id].week===w&&PLAN.days[L.id].dow===dw);return L?LV[L.id]:null};
const planClash=()=>{const seen={},out=[];LEVELS.forEach(L=>{const k=PLAN.days[L.id].week+'-'+PLAN.days[L.id].dow;if(seen[k])out.push([seen[k],L.name]);else seen[k]=L.name});return out};
function assessmentDays(from,n){const out=[];let s=from;for(let i=0;i<400&&out.length<n;i++){if(levelForDate(s))out.push(s);s=addDays(s,1)}return out}
function nextDayFor(idx,from){let s=from;for(let i=0;i<120;i++){const l=levelForDate(s);if(l&&l.idx===idx)return s;s=addDays(s,1)}return null}
const monthKey=s=>s.slice(0,7);

/* ---------------- RNG ---------------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------------- state ---------------- */
let rules={threshold:70,levelRule:'tier'};
let state, ui={mapSel:'grip',libQ:'',libCat:'all',libFree:false,view:'overview',role:'admin',filter:'all',q:'',planDay:null,absent:new Set(),prof:null,form:null,more:new Set(),curSel:null,layout:'list',group:'venue',venueF:'all',coachF:'all',sort:'progress'};
const VENUES=[
  {id:'mal',name:'Malleshwaram',sub:'Main centre · 4 courts'},
  {id:'ind',name:'Indiranagar',sub:'2 courts'},
  {id:'wf',name:'Whitefield',sub:'Weekend centre · 3 courts'}];
const VE=Object.fromEntries(VENUES.map(v=>[v.id,v]));
const ACADEMY={name:'PSB Academy',title:'Academy account',desc:'Owner · billing, curriculum & rules, every venue'};
const COACHES=[
  {id:'hc',name:'Kiran Rao',role:'head',title:'Head coach',venues:['mal','ind','wf'],batch:'All venues'},
  {id:'c1',name:'Divya Shetty',role:'assistant',title:'Coach',venues:['mal','ind'],batch:'Mon · Wed · Fri, 4–5 pm'},
  {id:'c2',name:'Rahul Menon',role:'assistant',title:'Coach',venues:['ind'],batch:'Tue · Thu · Sat, 5–6 pm'},
  {id:'c3',name:'Meera Iyer',role:'assistant',title:'Coach',venues:['wf','mal'],batch:'Sat · Sun, 8–9 am'}];
const CO=Object.fromEntries(COACHES.map(c=>[c.id,c]));
const coachList=()=>COACHES.filter(c=>c.role==='assistant');
const roleKind=()=>ui.role==='admin'?'admin':CO[ui.role]?.role==='head'?'head':'assistant';
const me=()=>ui.role==='admin'?{name:ACADEMY.name,title:ACADEMY.title}:CO[ui.role];

function genScores(st,levelId,date,r){
  const out={},weeks=Math.max(0,(D(date)-D(st.joined))/6048e5),ti=LV[levelId].idx;
  for(const s of skillsOf(levelId))for(const v of s.videos){

function levelMet(i,sk){
  if(rules.levelRule==='count')return SKILLS.filter(s=>sk[s.id].earned).length>=4*(i+1);
  return LEVELS.slice(0,i+1).every(L=>skillsOf(L.id).every(s=>sk[s.id].earned))}
function evaluate(st){
  const T=rules.threshold,best={},sk={},lv={},timeline=[];
  SKILLS.forEach(s=>sk[s.id]={earned:null,tries:0,streak:0,lastPass:null,history:[]});
  const atts=[...st.attempts].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  for(const a of atts){
    for(const s of skillsOf(a.level)){
      s.videos.forEach(v=>{best[v.id]=Math.max(best[v.id]??0,a.scores[v.id]??0)});
      const passNow=s.videos.every(v=>(a.scores[v.id]??0)>=T),o=sk[s.id];
      o.tries++;o.history.push({date:a.date,scores:s.videos.map(v=>a.scores[v.id]),passNow});o.lastPass=passNow;
      if(!o.earned){if(s.videos.every(v=>best[v.id]>=T)){o.earned=a.date;o.streak=0;timeline.push({date:a.date,kind:'skill',id:s.id})}else o.streak++}}
    LEVELS.forEach((L,i)=>{if(!lv[L.id]&&levelMet(i,sk)){lv[L.id]=a.date;timeline.push({date:a.date,kind:'level',id:L.id})}})}
  let level=-1;LEVELS.forEach((L,i)=>{if(lv[L.id])level=i});
  const earnedCount=SKILLS.filter(s=>sk[s.id].earned).length;
  const working=LEVELS.findIndex(L=>skillsOf(L.id).some(s=>!sk[s.id].earned));
  const attention=SKILLS.filter(s=>!sk[s.id].earned&&sk[s.id].streak>=2);
  return {best,sk,lv,level,earnedCount,working,attention,timeline,lastDate:atts.length?atts[atts.length-1].date:null}}
let cache=new Map();
const ev=st=>{if(!cache.has(st.id))cache.set(st.id,evaluate(st));return cache.get(st.id)};
const invalidate=()=>{cache=new Map()};
const S=id=>state.students.find(s=>s.id===id);
const unNotified=st=>ev(st).timeline.filter(t=>!st.notified.includes(t.kind+':'+t.id));
function bookedDay(st){return Object.keys(state.plans).filter(d=>d>=state.today&&!state.done[d]&&state.plans[d].includes(st.id)).sort()[0]||null}
function nextAssessment(st){const e=ev(st);if(e.working<0)return null;const b=bookedDay(st);if(b)return {date:b,level:levelForDate(b),booked:true};
  const d=nextDayFor(e.working,state.today);return {date:d,level:LV[LEVELS[e.working].id],booked:false}}

function runSession(date,levelIds,ids,manual){
  if(!Array.isArray(levelIds))levelIds=[levelIds];
  const before=new Map(ids.map(id=>[id,ev(S(id))]));
  const scoresBy={};
  ids.forEach(id=>{const st=S(id);levelIds.forEach(lid=>{const sc=manual?.[id]||genScores(st,lid,date,Math.random);scoresBy[id+'|'+lid]=sc;st.attempts.push({date,level:lid,scores:sc})})});
  if(date>state.today)state.today=date;
  if(levelForDate(date)&&levelIds.includes(levelForDate(date).id))state.done[date]=true;
  invalidate();
  const rows=ids.flatMap(id=>{const b=before.get(id),a=ev(S(id));
    return levelIds.map((lid,li)=>({id,level:lid,scores:scoresBy[id+'|'+lid],newSkills:skillsOf(lid).filter(s=>!b.sk[s.id].earned&&a.sk[s.id].earned).map(s=>s.id),
      had:skillsOf(lid).filter(s=>b.sk[s.id].earned).map(s=>s.id),levels:li===levelIds.length-1?LEVELS.filter(L=>!b.lv[L.id]&&a.lv[L.id]).map(L=>L.id):[]}))});
  const nb=rows.reduce((x,r)=>x+r.newSkills.length,0),ups=rows.flatMap(r=>r.levels.map(l=>S(r.id).name.split(' ')[0]+' → '+LV[l].award));
  const names=levelIds.map(l=>LV[l].name).join(' + ');
  state.log.unshift({date,kind:levelIds[0],text:`${names} assessment recorded for ${ids.length} ${ids.length>1?'students':'student'}: ${nb} new skill ${nb===1?'badge':'badges'}${ups.length?'; level-ups: '+ups.join(', '):''}.`});
  ui.results={date,levels:levelIds,students:ids.length,rows};ui.prof=null;
  render();if(ups.length)confetti()}

  renderModal();renderSim()}
function toast(t){const el=document.createElement('div');el.textContent=t;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),2600)}
function notify(st){const u=unNotified(st);u.forEach(t=>st.notified.push(t.kind+':'+t.id));if(u.length)state.log.unshift({date:state.today,kind:'info',text:`Shared ${u.length} ${u.length>1?'badges':'badge'} with ${st.name}'s family (WhatsApp, simulated).`});return u.length}

function renderAcct(){const k=roleKind(),M=me();
  document.getElementById('acctBtn').innerHTML=`<span class="av k-${k}">${k==='admin'?'PSB':initials(M.name)}</span><span class="t"><b>${M.name}</b><small>${M.title}</small></span>${ic('chev',13)}`;
  const item=(id,name,sub,kind)=>`<button role="menuitem" class="${ui.role===id?'on':''}" data-act="asRole" data-id="${id}"><span class="av k-${kind}">${kind==='admin'?'PSB':initials(name)}</span><span class="grow"><b>${name}</b><small>${sub}</small></span>${ui.role===id?`<span class="ck">${ic('check')}</span>`:''}</button>`;
  document.getElementById('acctMenu').innerHTML=`<div class="eyebrow">Academy account</div>${item('admin',ACADEMY.name,ACADEMY.desc,'admin')}
   <div class="eyebrow">Head coach</div>${COACHES.filter(c=>c.role==='head').map(c=>item(c.id,c.name,'All venues · assigns players','head')).join('')}
   <div class="eyebrow">Coaches</div>${coachList().map(c=>item(c.id,c.name,c.venues.map(v=>VE[v].name).join(' · '),'assistant')).join('')}`}
function setAcctMenu(open){const m=document.getElementById('acctMenu');m.hidden=!open;document.getElementById('acctBtn').setAttribute('aria-expanded',open)}
function setSim(open){const el=document.getElementById('sim');el.hidden=!open;document.getElementById('simBtn').setAttribute('aria-pressed',open);if(open)renderSim()}

document.addEventListener('click',e=>{
  if(!e.target.closest('.acct'))setAcctMenu(false);
  if(e.target.id==='modal'){ui.prof=null;ui.results=null;ui.form=null;renderModal();return}
  const a=e.target.closest('[data-act]');if(!a)return;const d=a.dataset;
  switch(d.act){
    case 'view':ui.view=d.v;render();scrollTo(0,0);break;
    case 'filter':ui.filter=d.f;render();break;
    case 'prof':if(e.target.closest('select'))return;openProfile(d.id);break;
    case 'close':ui.prof=null;renderModal();break;
    case 'ptab':ui.prof.tab=d.t;renderModal();break;
    case 'attOpen':ui.prof.att=ui.prof.att===d.k?null:d.k;renderModal();break;
    case 'selSkill':ui.prof.sel=ui.prof.sel===d.s?null:d.s;renderModal();break;
    case 'book':{(state.plans[d.d]=state.plans[d.d]||[]).push(d.id);toast(`Added to ${levelForDate(d.d).name} day, ${fmt(d.d)}`);render();break}
    case 'notify':{const n=notify(S(d.id));toast(`Shared ${n} ${n>1?'badges':'badge'} with the family`);render();break}
    case 'notifyAll':{let n=0;visible().forEach(s=>n+=notify(s));toast(`Shared ${n} badges with families`);render();break}
    case 'notifyRes':{let n=0;ui.results.rows.forEach(r=>n+=notify(S(r.id)));ui.results=null;toast(n?`Shared ${n} new badges with families`:'No new badges to share');render();break}
    case 'closeRes':ui.results=null;render();break;
    case 'plan':ui.view='planner';ui.planDay=d.d;ui.prof=null;render();break;
    case 'addAll':{const r=recommend(ui.planDay).rec.map(x=>x.s.id);state.plans[ui.planDay]=[...new Set([...(state.plans[ui.planDay]||[]),...r])];render();break}
    case 'runPlan':{const day=ui.planDay;runSession(day,levelForDate(day).id,state.plans[day]);break}
    case 'absent':ui.absent.has(d.id)?ui.absent.delete(d.id):ui.absent.add(d.id);render();break;
    case 'openSim':setSim(document.getElementById('sim').hidden);break;
    case 'closeSim':setSim(false);break;
    case 'acctMenu':setAcctMenu(document.getElementById('acctMenu').hidden);break;
    case 'asRole':ui.role=d.id;ui.filter='all';ui.coachF='all';ui.venueF='all';ui.absent=new Set();ui.prof=null;ui.form=null;sim.student=null;sim.scores=null;setAcctMenu(false);
      if(roleKind()==='assistant'&&ui.group==='coach')ui.group='venue';render();toast('Now viewing as '+me().name);break;
    case 'group':ui.group=d.g;render();break;
    case 'curSel':ui.curSel=ui.curSel===d.s?null:d.s;render();break;
    case 'playVid':toast(`Sample clip · ${d.l} (the real recording plays here)`);break;
    case 'mapSel':ui.mapSel=d.s;render();break;
    case 'map':{const m=MAP[ui.mapSel]||(MAP[ui.mapSel]=[]);if(!m.includes(d.k))m.push(d.k);render();toast(`${LK[d.k].name} → ${SK[ui.mapSel].name}`);break}
    case 'unmap':{const m=MAP[ui.mapSel]||[];const i=m.indexOf(d.k);if(i>=0)m.splice(i,1);render();break}
    case 'libCat':ui.libCat=d.c;render();break;
    case 'newSkill':{const n=document.getElementById('newSkill').value.trim();if(!n){document.getElementById('newSkill').focus();break}
      const k={id:'k'+LIB.length,name:n,cat:document.getElementById('newCat').value};LIB.push(k);LK[k.id]=k;LIBN[n]=k.id;(MAP[ui.mapSel]=MAP[ui.mapSel]||[]).push(k.id);
      ui.libQ='';render();toast(`New skill “${n}” added to ${SK[ui.mapSel].name}`);break}
    case 'newSet':{const L=LV[d.col],id='set'+Date.now();
      const st={id,tier:d.col,name:'New '+L.name+' skill set',abbr:'NS',std:'Standard to be agreed with PSB',order:SKILLS.length,videos:[{id:id+'.v1',label:'Video 1'}]};
      SKILLS.push(st);SK[id]=st;MAP[id]=[];ui.mapSel=id;invalidate();render();toast('New skill set added. Add skills from the library.');break}
    case 'more':ui.more.has(d.id)?ui.more.delete(d.id):ui.more.add(d.id);render();break;
    case 'layout':ui.layout=d.l;render();break;
    case 'venueGo':ui.view='students';ui.venueF=d.v;ui.group='coach';ui.filter='all';render();scrollTo(0,0);break;
    case 'addPlayer':ui.form={type:'player'};renderModal();setTimeout(()=>document.getElementById('fName')?.focus(),30);break;
    case 'addCoach':ui.form={type:'coach'};renderModal();setTimeout(()=>document.getElementById('fName')?.focus(),30);break;
    case 'closeForm':ui.form=null;renderModal();break;
    case 'saveForm':{const name=document.getElementById('fName').value.trim();if(!name){document.getElementById('fName').focus();toast('Enter a name first');break}
      if(ui.form.type==='player'){const coachId=document.getElementById('fCoach').value,venue=document.getElementById('fVenue').value,age=+document.getElementById('fAge').value||8;
        const st={id:'n'+Date.now(),name,age,coachId,venue,joined:state.today,ability:70+Math.round(Math.random()*12),weak:null,attempts:[],notified:[],note:'New this week'};
        state.students.push(st);invalidate();state.log.unshift({date:state.today,kind:'info',text:`Added ${name} at ${VE[venue].name} under ${CO[coachId].name}: starts at Spark, 0 skill badges.`});
        ui.form=null;ui.filter='all';ui.q='';render();toast(`${name} added · starts at Spark`)}
      else{const role=document.querySelector('input[name=frole]:checked').value,venues=[...document.querySelectorAll('input[name=fven]:checked')].map(x=>x.value);
        const c={id:'c'+Date.now(),name,role,title:role==='head'?'Head coach':'Coach',venues:role==='head'?VENUES.map(v=>v.id):(venues.length?venues:['mal']),batch:role==='head'?'All venues':(document.getElementById('fBatch').value.trim()||'Batch to be set')};
        COACHES.push(c);CO[c.id]=c;state.log.unshift({date:state.today,kind:'info',text:`Added ${c.title.toLowerCase()} ${name}.`});
        ui.form=null;render();toast(`${name} added as ${c.title.toLowerCase()}`)}
      break}
    case 'stab':sim.tab=d.t;renderSim();break;
    case 'reroll':sim.scores=null;renderSim();break;
    case 'allpass':Object.keys(sim.scores).forEach(k=>sim.scores[k]=Math.max(sim.scores[k],rules.threshold+4));renderSim();break;
    case 'submitSim':{const st=S(sim.student);runSession(sim.date,sim.level,[st.id],{[st.id]:{...sim.scores}});sim.scores=null;renderSim();break}
    case 'onboard':{
      const name=document.getElementById('obName').value.trim()||'New student',age=+document.getElementById('obAge').value||8,coachId=document.getElementById('obCoach').value,ability=+document.getElementById('obSkill').value;
      const place=document.querySelector('input[name=place]:checked').value;
      const st={id:'n'+Date.now(),name,age,coachId,venue:CO[coachId].venues[0],joined:state.today,ability:ability+Math.round(Math.random()*6-3),weak:null,attempts:[],notified:[],note:place==='placement'?'Placement tests on joining':''};
      state.students.push(st);invalidate();state.log.unshift({date:state.today,kind:'info',text:`Onboarded ${name} under ${CO[coachId].name}: 0 badges, starts at Spark.`});
      if(place==='placement'){runSession(state.today,['spark','scout'],[st.id]);toast(`${name} placed with ${ev(st).earnedCount} badges from placement tests`)}
      else{toast(`${name} onboarded with 0 badges`);sim.student=st.id;sim.scores=null;render()}
      break}
    case 'scenario':state=d.s==='dry'?dryRun():seeded();invalidate();ui.prof=null;ui.results=null;ui.planDay=null;ui.absent=new Set();sim.student=null;sim.scores=null;
      if(d.s==='dry'){ui.role='c1';ui.view='students'}
      toast(d.s==='dry'?'Dry run loaded: 4 athletes at 0 badges':'Seeded academy loaded');render();break;
  }});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.plan){PLAN.days[t.dataset.l][t.dataset.plan]=+t.value;ui.planDay=null;render();toast(`${LV[t.dataset.l].name} day is now the ${dayLabel(t.dataset.l)}`);return}
  if(t.name==='fifth'){PLAN.fifth=t.value;render();toast('5th week setting saved');return}
  if(t.name==='pmode'){PLAN.mode=t.value;render();toast(t.value==='auto'?'Recommended students will be added automatically':'Coaches will add students themselves');return}
  if(t.id==='pNotice'){PLAN.notice=Math.max(1,Math.min(30,+t.value||15));render();toast(`Parents notified ${PLAN.notice} days ahead`);return}
  if(t.id==='libFree'){ui.libFree=t.checked;render();return}
  if(t.id==='mapName'){const v=t.value.trim();if(v){SK[ui.mapSel].name=v;render();toast('Skill set renamed')}return}
  if(t.id==='mapCol'){moveSet(ui.mapSel,t.value);return}
  if(t.id==='pVenue'){ui.venueF=t.value;render();return}
  if(t.id==='pCoach'){ui.coachF=t.value;render();return}
  if(t.id==='pSort'){ui.sort=t.value;render();return}
  if(t.name==='frole'){document.querySelectorAll('#fRole label').forEach(l=>l.classList.toggle('on',l.contains(document.querySelector('input[name=frole]:checked'))));return}
  if(t.dataset.coach){S(t.dataset.coach).coachId=t.value;toast(`${S(t.dataset.coach).name} assigned to ${CO[t.value].name}`);render();return}
  if(t.dataset.pick){const p=state.plans[ui.planDay]=state.plans[ui.planDay]||[];t.checked?p.push(t.dataset.pick):p.splice(p.indexOf(t.dataset.pick),1);render();return}
  if(t.id==='simStu'){sim.student=t.value;sim.scores=null;renderSim()}
  if(t.id==='simLvl'){sim.level=t.value;sim.scores=null;sim.date=null;renderSim()}
  if(t.id==='simDate'){sim.date=t.value}
  if(t.name==='lr'){rules.levelRule=t.value;invalidate();toast('Level rule changed: every badge replayed');render()}
  if(t.name==='place'){document.querySelectorAll('#obPlace label').forEach(l=>l.classList.toggle('on',l.contains(document.querySelector('input[name=place]:checked'))))}
  if(t.id==='thr'){rules.threshold=+t.value;invalidate();toast(`Pass mark set to ${rules.threshold}: badges replayed`);render()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='libQ'){ui.libQ=t.value;render();return}
  if(t.id==='q'){ui.q=t.value;render()}
  if(t.dataset.score){const x=+t.value;sim.scores[t.dataset.score]=x;const b=document.getElementById('sv-'+t.dataset.score.replace('.','-'));b.textContent=x;b.className='num '+(x>=rules.threshold?'p':'f')}
  if(t.id==='thr'){document.getElementById('thrV').textContent=t.value}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=button][data-act=prof]')){openProfile(e.target.dataset.id);return}
  if(e.key==='Escape'){setAcctMenu(false);if(ui.results||ui.prof||ui.form){ui.results=null;ui.prof=null;ui.form=null;renderModal()}else setSim(false)}});


function moveSet(id,col){const st=SK[id];if(!st||st.tier===col)return;st.tier=col;invalidate();render();toast(`${st.name} moved to the ${LV[col].name} badge · badges replayed`)}
let drag=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;drag={type:el.dataset.drag,id:el.dataset.id};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',drag.id)}catch(_){}el.classList.add('dragging')});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));drag=null});
const dropTarget=e=>{if(!drag)return null;const el=e.target.closest&&e.target.closest('[data-drop]');if(!el)return null;
  if(drag.type==='skill'){const s=e.target.closest('[data-drop=set]');return s}
  return e.target.closest('[data-drop=col]')};
document.addEventListener('dragover',e=>{const t=dropTarget(e);document.querySelectorAll('.over').forEach(x=>x!==t&&x.classList.remove('over'));if(t){e.preventDefault();t.classList.add('over')}});
document.addEventListener('drop',e=>{const t=dropTarget(e);if(!t)return;e.preventDefault();t.classList.remove('over');
  if(drag.type==='skill'){const sid=t.dataset.id||t.dataset.s,m=MAP[sid]||(MAP[sid]=[]);if(!m.includes(drag.id)){m.push(drag.id);toast(`${LK[drag.id].name} → ${SK[sid].name}`)}ui.mapSel=sid;render()}
  else moveSet(drag.id,t.dataset.col);drag=null});

/* ---------------- confetti ---------------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti');c.hidden=false;c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
  const x=c.getContext('2d'),cs=getComputedStyle(document.documentElement),cols=['--t-spark','--t-scout','--t-star','--t-champ','--brand'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:140},()=>({x:c.width/2+(Math.random()-.5)*c.width*.3,y:c.height*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*14-4)*devicePixelRatio,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2*devicePixelRatio/1.4,p.r*devicePixelRatio/1.4);x.restore()});
    if(++f<110)requestAnimationFrame(tick);else{x.clearRect(0,0,c.width,c.height);c.hidden=true}})()}

document.body.insertAdjacentHTML('afterbegin',svgDefs());
state=seeded();render();
</script>
